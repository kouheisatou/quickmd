<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>QuickMD</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    outline: none;
  }
  #err {
    color: #d7dbe0;
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 14px;
    padding: 24px;
    line-height: 1.8;
  }
</style>
</head>
<body>
<video id="v" src="{{SRC}}" controls autoplay playsinline></video>
<div id="err" hidden></div>
<script>
  const v = document.getElementById('v');
  const err = document.getElementById('err');

  v.addEventListener('error', () => {
    v.hidden = true;
    err.hidden = false;
    err.textContent = 'この動画は再生できませんでした。OS が対応していない形式かもしれません。';
  });

  // 空白で止める・再開する。左右で10秒ずつ動かす。
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      e.preventDefault();
      v.paused ? v.play() : v.pause();
    } else if (e.key === 'ArrowRight') {
      v.currentTime += 10;
    } else if (e.key === 'ArrowLeft') {
      v.currentTime -= 10;
    }
  });
</script>
</body>
</html>
