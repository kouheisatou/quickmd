<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; background: #fff; }
#stage { position: absolute; left: -10000px; top: 0; width: 1200px; }
</style></head>
<body>
<div id="stage"></div>
<script>
window.MathJax = {
  startup: { typeset: false },
  svg: { fontCache: 'local' },
};
</script>
<script src="vendor:tex-svg.js"></script>
<script src="vendor:mermaid.min.js"></script>
<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const reply = (o) => window.ipc.postMessage(JSON.stringify(o));

  let mermaidReady = false;
  function initMermaid(dark) {
    window.mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: dark ? 'dark' : 'default',
      darkMode: !!dark,
      fontFamily: 'Hiragino Sans, Yu Gothic UI, Noto Sans JP, sans-serif',
      // 図の中の文字を HTML ではなく SVG の文字として出す。
      // HTML のままだと、受け取った側で文字が消える。
      htmlLabels: false,
      flowchart: { htmlLabels: false, useMaxWidth: false },
      sequence: { useMaxWidth: false },
      class: { htmlLabels: false, useMaxWidth: false },
      gantt: { useMaxWidth: false },
    });
    mermaidReady = true;
  }

  /// 数式の SVG は ex という単位で出てくる。受け取った側が扱えるよう px へ直し、
  /// 文字の色も本文に合わせてここで塗っておく。
  function fixMathSvg(svg, ex, color) {
    const num = (v) => parseFloat(String(v).replace(/[^\d.\-]/g, '')) || 0;
    const w = num(svg.getAttribute('width'));
    const h = num(svg.getAttribute('height'));
    if (w) svg.setAttribute('width', (w * ex).toFixed(2) + 'px');
    if (h) svg.setAttribute('height', (h * ex).toFixed(2) + 'px');
    svg.setAttribute('color', color);
    svg.querySelectorAll('[fill="currentColor"]').forEach((e) => e.setAttribute('fill', color));
    svg.querySelectorAll('[stroke="currentColor"]').forEach((e) => e.setAttribute('stroke', color));
    const g = svg.querySelector('g[data-mml-node="math"], g');
    if (g && !g.getAttribute('fill')) g.setAttribute('fill', color);
    return svg.outerHTML;
  }

  window.__render = async (line) => {
    let req;
    try {
      req = JSON.parse(line);
    } catch (e) {
      return reply({ ok: false, error: '依頼を読めませんでした' });
    }
    try {
      if (req.kind === 'mermaid') {
        if (!mermaidReady) initMermaid(req.dark);
        const id = 'g' + String(req.id).replace(/\W/g, '') + '_' + Math.floor(Math.random() * 1e9);
        const { svg } = await window.mermaid.render(id, req.src);
        return reply({ id: req.id, ok: true, svg });
      }
      if (req.kind === 'math') {
        const node = window.MathJax.tex2svg(req.src, { display: !!req.display });
        const svg = fixMathSvg(
          node.querySelector('svg'),
          req.ex || 8,
          req.color || (req.dark ? '#d7dbe0' : '#1f2328')
        );
        return reply({ id: req.id, ok: true, svg });
      }
      if (req.kind === 'thumb') {
        const t = await thumbnail(req.src, req.at || 0.1);
        return reply({ id: req.id, ok: true, ...t });
      }
      reply({ id: req.id, ok: false, error: '未対応の種類: ' + req.kind });
    } catch (e) {
      reply({ id: req.id, ok: false, error: String((e && e.message) || e) });
    }
  };

  /// 手元のファイルを指す番地を作る。file:// は別の出所として弾かれるので、
  /// このアプリ専用の qmdfile:// を通す。
  function fileUrl(p) {
    const path = p.replace(/^file:\/\//, '');
    return 'qmdfile://localhost/' + encodeURIComponent(path).replace(/%2F/g, '/');
  }

  /// 動画の1コマを取り出して、PNG の絵にして返す。
  /// OS が持っている再生の仕組みを使うので、別の道具を入れなくてよい。
  function thumbnail(src, at) {
    return new Promise((resolve, reject) => {
      const v = document.createElement('video');
      v.preload = 'auto';
      v.muted = true;
      v.playsInline = true;
      v.src = fileUrl(src);

      const fail = (why) => reject(new Error(why));
      const timer = setTimeout(() => fail('時間内に読めませんでした'), 15000);

      v.addEventListener('error', () => {
        clearTimeout(timer);
        fail('動画を読み込めません');
      });

      v.addEventListener('loadeddata', () => {
        // 真っ黒な先頭を避けるため、少し進んだところを取る
        const t = Math.min(at, Math.max(0, (v.duration || 1) - 0.05));
        v.currentTime = t;
      });

      v.addEventListener('seeked', () => {
        clearTimeout(timer);
        try {
          const w = v.videoWidth;
          const h = v.videoHeight;
          const max = 960;
          const scale = Math.min(1, max / Math.max(w, h));
          const c = document.createElement('canvas');
          c.width = Math.round(w * scale);
          c.height = Math.round(h * scale);
          c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
          resolve({
            png: c.toDataURL('image/png').split(',')[1],
            width: w,
            height: h,
            duration: v.duration || 0,
          });
        } catch (e) {
          fail(String((e && e.message) || e));
        }
      });

      stage.appendChild(v);
    });
  }

  const waitReady = () => {
    if (window.mermaid && window.MathJax && window.MathJax.tex2svg) {
      reply('ready');
    } else {
      setTimeout(waitReady, 20);
    }
  };
  waitReady();
})();
</script>
</body></html>
